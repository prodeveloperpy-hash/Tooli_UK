# Redirect www to non-www
server {
    listen 80;
    listen [::]:80;
    server_name www.tooli.uk;
    return 301 https://tooli.uk$request_uri;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tooli.uk;
    return 301 https://tooli.uk$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tooli.uk;

    # SSL certificates (managed by Certbot or your SSL provider)
    # ssl_certificate /etc/letsencrypt/live/tooli.uk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tooli.uk/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
