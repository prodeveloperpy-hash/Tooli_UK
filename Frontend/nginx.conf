server {
    listen 80;
    server_name tooli.uk;
    return 301 https://www.tooli.uk$request_uri;
}

server {
    listen 80;
    server_name www.tooli.uk _;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Vite's SEO build creates /route/index.html for every indexable URL.
        # Prefer it over the SPA fallback so crawlers receive route metadata in
        # the initial response (without waiting for client-side JavaScript).
        try_files $uri $uri/index.html =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
